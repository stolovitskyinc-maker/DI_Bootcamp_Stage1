<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock 1 Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Outer Structural Container Framework -->
    <div class="layout-container">
        
        <!-- Main Content Area with Stacking Rows -->
        <div class="content-wrapper">
            
            <!-- Row 1 -->
            <div class="content-row">
                <div class="box box-red"></div>
                <div class="box box-blue"></div>
            </div>

            <!-- Row 2 -->
            <div class="content-row">
                <div class="box box-red"></div>
                <div class="box box-blue"></div>
            </div>

            <!-- Row 3 -->
            <div class="content-row">
                <div class="box box-red"></div>
                <div class="box box-blue"></div>
            </div>
            
        </div>

        <!-- Bottom Footer Banner Block (Yellow) -->
        <footer class="footer-banner"></footer>
        
    </div>

</body>
</html>
